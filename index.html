<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>客製化花束小幫手</title>
    <style>
        body { background-color: #ffdce6; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; color: #5c4d50; }
        .app-container { width: 100%; max-width: 500px; background: white; border: 3px solid #ff9eb8; padding: 15px; border-radius: 8px; box-shadow: 5px 5px 0px #e68fa6; }
        
        .card { border: 2px solid #ff9eb8; padding: 15px; margin-bottom: 15px; background: #fffdfd; }
        h2 { font-size: 16px; border-bottom: 2px solid #ff9eb8; padding-bottom: 5px; color: #d67b91; margin-top: 0; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .item { border: 2px solid #ff9eb8; padding: 5px; text-align: center; cursor: pointer; }
        .item.selected { background-color: #ffdae2; }
        .item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: 1px solid #ff9eb8; display: block; }
        .item p { font-size: 12px; margin: 5px 0 0 0; }

        textarea { width: 100%; height: 100px; border: 2px solid #ff9eb8; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; background: #d67b91; color: white; border: none; padding: 10px; margin-top: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <h2>🌸 選擇花朵 (選5支)</h2>
        <div class="grid" id="flower-grid"></div>
    </div>
    <div class="card">
        <h2>🎀 選擇蝴蝶結</h2>
        <div class="grid" id="bow-grid"></div>
    </div>
    <div class="card">
        <h2>🏺 選擇玻璃瓶</h2>
        <div class="grid" id="bottle-grid"></div>
    </div>
    <div class="card">
        <h2>✨ 訂購文字</h2>
        <textarea id="output" readonly></textarea>
        <button onclick="copyText()">複製文字傳給闆娘</button>
    </div>
</div>

<script>
    const createItems = (count, prefix, containerId, isMulti) => {
        const container = document.getElementById(containerId);
        for(let i=1; i<=count; i++) {
            let div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<img src="https://picsum.photos/200?random=${i+prefix}"><p>${prefix}${i}號</p>`;
            div.onclick = () => {
                div.classList.toggle('selected');
                updateText();
            };
            container.appendChild(div);
        }
    };

    function updateText() {
        let flowers = Array.from(document.querySelectorAll('#flower-grid .selected')).map(el => el.innerText.replace('花','').replace('號',''));
        let bow = document.querySelector('#bow-grid .selected')?.innerText.replace('蝴蝶結','').replace('號','');
        let bottle = document.querySelector('#bottle-grid .selected')?.innerText.replace('玻璃瓶','').replace('號','');
        document.getElementById('output').value = `我想要這些花${flowers.join(',')}\n蝴蝶結要${bow||'？'}號\n玻璃瓶要${bottle||'？'}號\n謝謝你!`;
    }

    function copyText() {
        document.getElementById('output').select();
        document.execCommand('copy');
        alert('已複製！');
    }

    createItems(15, '花', 'flower-grid');
    createItems(4, '蝴蝶結', 'bow-grid');
    createItems(4, '玻璃瓶', 'bottle-grid');
</script>
</body>
</html>
