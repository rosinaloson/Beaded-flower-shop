<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Beaded Vase Bouquet - 自助選花小幫手</title>
    <style>
        :root {
            --primary-pink: #f4d1d8;
            --dark-pink: #d996a6;
            --text-color: #5a4a4e;
            --bg-color: #fdfbfb;
            --card-bg: #ffffff;
            --shadow: 0 4px 15px rgba(217, 150, 166, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: var(--dark-pink);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #8c787c;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            border-left: 4px solid var(--dark-pink);
            padding-left: 10px;
            margin: 25px 0 15px 0;
        }

        /* 網格選單 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .item-card {
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            position: relative;
        }

        .item-card:hover {
            border-color: var(--primary-pink);
        }

        .item-card.selected {
            border-color: var(--dark-pink);
            background-color: #fff8f9;
        }

        .item-card img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .item-name {
            font-size: 13px;
            font-weight: 500;
        }

        /* 預覽與輸出結果區 */
        .output-section {
            margin-top: 30px;
            background: #fff4f6;
            border-radius: 15px;
            padding: 20px;
            border: 1px dashed var(--dark-pink);
        }

        .output-title {
            font-weight: bold;
            color: var(--dark-pink);
            margin-bottom: 10px;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            height: 110px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            background: #fff;
            box-sizing: border-box;
            color: var(--text-color);
        }

        .copy-btn {
            display: block;
            width: 100%;
            background-color: var(--dark-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background-color: #c78292;
        }

        .limit-hint {
            font-size: 12px;
            color: #d9534f;
            text-align: right;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Custom Beaded Vase Bouquet</h1>
    <div class="subtitle">選擇你喜歡的花朵、蝴蝶結與玻璃瓶，客製專屬花束</div>

    <!-- 1. 選擇花朵 -->
    <div class="section-title">選擇花朵 (最多 5 支)</div>
    <div class="grid" id="flowers-grid">
        <!-- 程式會自動生成花朵選項 (代號 1 ~ 15) -->
    </div>
    <div class="limit-hint" id="flower-limit-hint">已選擇 0 / 5 支</div>

    <!-- 2. 選擇蝴蝶結 -->
    <div class="section-title">選擇蝴蝶結 (單選)</div>
    <div class="grid" id="bows-grid">
        <!-- 程式會自動生成蝴蝶結選項 -->
    </div>

    <!-- 3. 選擇玻璃瓶 -->
    <div class="section-title">選擇玻璃瓶 (單選)</div>
    <div class="grid" id="bottles-grid">
        <!-- 程式會自動生成玻璃瓶選項 -->
    </div>

    <!-- 結果輸出區 -->
    <div class="output-section">
        <div class="output-title">✨ 您的訂購文字（複製後直接傳給闆娘）</div>
        <textarea id="result-text" readonly></textarea>
        <button class="copy-btn" onclick="copyText()">一鍵複製訂購文字</button>
    </div>
</div>

<script>
    // 示範資料：你可以隨時修改圖片網址與名稱
    // 花朵 1~15
    const flowers = Array.from({ length: 15 }, (_, i) => ({
        id: i + 1,
        name: `花朵 #${i + 1}`,
        img: "https://images.unsplash.com/photo-1563245372-f21724e3856d?w=200&auto=format&fit=crop&q=80" // 替代圖片網址，可換成你的商品圖
    }));

    // 蝴蝶結 1~4
    const bows = Array.from({ length: 4 }, (_, i) => ({
        id: i + 1,
        name: `蝴蝶結 #${i + 1}`,
        img: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=200&auto=format&fit=crop&q=80"
    }));

    // 玻璃瓶 1~4
    const bottles = Array.from({ length: 4 }, (_, i) => ({
        id: i + 1,
        name: `玻璃瓶 #${i + 1}`,
        img: "https://images.unsplash.com/photo-1601004890684-d8cbf643f5f2?w=200&auto=format&fit=crop&q=80"
    }));

    let selectedFlowers = []; // 儲存選中的花朵ID
    let selectedBow = null;   // 儲存選中的蝴蝶結ID
    let selectedBottle = null;// 儲存選中的玻璃瓶ID

    // 初始化渲染介面
    function render() {
        // 渲染花朵
        const flowerContainer = document.getElementById('flowers-grid');
        flowerContainer.innerHTML = flowers.map(f => `
            <div class="item-card ${selectedFlowers.includes(f.id) ? 'selected' : ''}" onclick="toggleFlower(${f.id})">
                <img src="${f.img}" alt="${f.name}">
                <div class="item-name">${f.name}</div>
            </div>
        `).join('');

        document.getElementById('flower-limit-hint').innerText = `已選擇 ${selectedFlowers.length} / 5 支`;

        // 渲染蝴蝶結
        const bowContainer = document.getElementById('bows-grid');
        bowContainer.innerHTML = bows.map(b => `
            <div class="item-card ${selectedBow === b.id ? 'selected' : ''}" onclick="selectBow(${b.id})">
                <img src="${b.img}" alt="${b.name}">
                <div class="item-name">${b.name}</div>
            </div>
        `).join('');

        // 渲染玻璃瓶
        const bottleContainer = document.getElementById('bottles-grid');
        bottleContainer.innerHTML = bottles.map(b => `
            <div class="item-card ${selectedBottle === b.id ? 'selected' : ''}" onclick="selectBottle(${b.id})">
                <img src="${b.img}" alt="${b.name}">
                <div class="item-name">${b.name}</div>
            </div>
        `).join('');

        updateResultText();
    }

    // 點擊花朵（多選，上限5支）
    function toggleFlower(id) {
        if (selectedFlowers.includes(id)) {
            selectedFlowers = selectedFlowers.filter(fId => fId !== id);
        } else {
            if (selectedFlowers.length >= 5) {
                alert('最多只能選擇 5 支花喔！');
                return;
            }
            selectedFlowers.push(id);
        }
        render();
    }

    // 點擊蝴蝶結（單選）
    function selectBow(id) {
        selectedBow = (selectedBow === id) ? null : id;
        render();
    }

    // 點擊玻璃瓶（單選）
    function selectBottle(id) {
        selectedBottle = (selectedBottle === id) ? null : id;
        render();
    }

    // 更新文字框內容
    function updateResultText() {
        let flowerStr = selectedFlowers.length > 0 ? selectedFlowers.join(',') : '尚未選擇';
        let bowStr = selectedBow ? `${selectedBow}號` : '尚未選擇';
        let bottleStr = selectedBottle ? `${selectedBottle}號` : '尚未選擇';

        let text = `我想要這些花${flowerStr}\n蝴蝶結要${bowStr}\n玻璃瓶要${bottleStr}\n謝謝你!`;
        
        // 如果全部沒選顯示提示，否則顯示格式化文字
        document.getElementById('result-text').value = text;
    }

    // 複製文字功能
    function copyText() {
        const textarea = document.getElementById('result-text');
        if (selectedFlowers.length === 0 || !selectedBow || !selectedBottle) {
            alert('請完整選擇花朵、蝴蝶結與玻璃瓶後再複製喔！');
            return;
        }
        textarea.select();
        document.execCommand('copy');
        alert('已成功複製訂購文字！快貼給闆娘吧 💕');
    }

    // 初始執行
    render();
</script>

</body>
</html>
