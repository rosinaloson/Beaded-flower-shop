<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿桑的選花小幫手</title>
    <style>
        body {
            background-color: #ffdce6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 10px;
            color: #5c4d50;
            margin: 0;
        }

        .window-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 3px solid #e68fa6;
            box-shadow: 6px 6px 0px rgba(213, 123, 145, 0.4);
            border-radius: 4px;
            overflow: hidden;
        }

        .window-header {
            background-color: #d67b91;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-buttons span {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: white;
            border: 1px solid #b3566d;
            margin-left: 4px;
            text-align: center;
            line-height: 12px;
            font-size: 10px;
            color: #d67b91;
            cursor: pointer;
        }

        .tab-bar {
            display: flex;
            background-color: #f7c5d1;
            border-bottom: 3px solid #e68fa6;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #7a5c63;
            background: #f7c5d1;
            border: none;
            border-right: 2px solid #e68fa6;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: white;
            color: #d67b91;
            border-bottom: 3px solid white;
            margin-bottom: -3px;
        }

        .tab-content {
            display: none;
            padding: 15px;
            background: #fffdfd;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            border: 2px solid #ff9eb8;
            padding: 12px;
            margin-bottom: 12px;
            background: white;
        }

        h3 {
            font-size: 14px;
            border-bottom: 2px solid #ff9eb8;
            padding-bottom: 5px;
            color: #d67b91;
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item {
            border: 2px solid #ff9eb8;
            padding: 5px;
            text-align: center;
            cursor: pointer;
            background: white;
            position: relative;
        }

        .item.selected {
            background-color: #ffdae2;
        }

        .item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 1px solid #ff9eb8;
            display: block;
        }

        /* 庫存為0時，圖片變淺灰色 */
        .item.out-of-stock img {
            filter: grayscale(100%) brightness(150%);
            opacity: 0.5;
        }
        .item.out-of-stock {
            background-color: #f2f2f2;
            border-color: #ccc;
        }

        .item p {
            font-size: 12px;
            margin: 5px 0 0 0;
        }

        textarea {
            width: 100%;
            height: 90px;
            border: 2px solid #ff9eb8;
            margin-top: 10px;
            padding: 8px;
            box-sizing: border-box;
            font-size: 13px;
        }

        .action-btn {
            width: 100%;
            background: #d67b91;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .action-btn:hover {
            background: #c26a80;
        }

        /* 後台管理樣式 */
        .admin-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            align-items: center;
            background: #fff5f7;
            padding: 6px;
            border: 1px solid #ff9eb8;
        }
        .admin-row img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border: 1px solid #ccc;
        }
        .admin-row input[type="text"] {
            flex: 1;
            padding: 4px;
            border: 1px solid #ff9eb8;
            font-size: 12px;
        }
        .admin-row input[type="number"] {
            width: 50px;
            padding: 4px;
            border: 1px solid #ff9eb8;
            font-size: 12px;
        }
        .del-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="window-container">
    <div class="window-header">
        <span>♥ 阿桑的選花小幫手 v1.995</span>
        <div class="window-buttons">
            <span>_</span><span>□</span><span>×</span>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn" onclick="switchTab(0)">🍀歡迎光臨🍀</button>
        <button class="tab-btn active" onclick="switchTab(1)">🌸花朵選擇🌸</button>
        <button class="tab-btn" onclick="switchTab(2)">✨作品展示✨</button>
        <button class="tab-btn" onclick="switchTab(3)">⚙️</button>
    </div>

    <!-- 頁籤 0：歡迎光臨 -->
    <div class="tab-content" id="tab-0">
        <div class="card" style="text-align: center; padding: 30px 10px;">
            <h2 style="color: #d67b91; margin-top: 0;">✨ 歡迎來到客製化花束小幫手 ✨</h2>
            <p style="font-size: 13px; line-height: 1.6;">請點擊上方 **「🌸花朵選擇🌸」** 開始挑選你喜歡的花朵、蝴蝶結與玻璃瓶，完成後一鍵複製文字傳給闆娘即可！💕</p>
            <button class="action-btn" onclick="switchTab(1)">馬上開始選花</button>
        </div>
    </div>

    <!-- 頁籤 1：花朵選擇 -->
    <div class="tab-content active" id="tab-1">
        <div class="card">
            <h3>🌸 選擇花朵 (最多選5支)</h3>
            <div class="grid" id="flower-grid"></div>
        </div>
        <div class="card">
            <h3>🎀 選擇蝴蝶結 (單選)</h3>
            <div class="grid" id="bow-grid"></div>
        </div>
        <div class="card">
            <h3>🏺 選擇玻璃瓶 (單選)</h3>
            <div class="grid" id="bottle-grid"></div>
        </div>
        <div class="card">
            <h3>✨ 您的訂購文字</h3>
            <textarea id="output" readonly></textarea>
            <button class="action-btn" onclick="copyText()">一鍵複製訂購文字</button>
        </div>
    </div>

    <!-- 頁籤 2：作品展示 -->
    <div class="tab-content" id="tab-2">
        <div class="card">
            <h3>✨ 精選作品參考</h3>
            <div class="grid" id="portfolio-grid"></div>
        </div>
    </div>

    <!-- 頁籤 3：員工後台管理 -->
    <div class="tab-content" id="tab-3">
        <div id="login-box" class="card" style="text-align: center; padding: 30px 10px;">
            <p style="font-weight: bold; color: #d67b91; font-size: 14px;">員工專用非請勿進🥺</p>
            <input type="password" id="admin-pwd" placeholder="請輸入密碼" style="padding: 8px; border: 2px solid #ff9eb8; width: 60%; margin-bottom: 10px;">
            <br>
            <button class="action-btn" style="width: 70%;" onclick="checkPassword()">登入後台</button>
        </div>

        <div id="admin-panel" style="display: none;">
            <!-- 花朵與庫存管理 -->
            <div class="card">
                <h3>🌸 花朵商品與庫存管理</h3>
                <div style="margin-bottom: 10px; display: flex; gap: 5px;">
                    <input type="text" id="new-name" placeholder="名稱/編號" style="flex:1; padding:5px; border:1px solid #ff9eb8;">
                    <input type="text" id="new-img" placeholder="圖片網址" style="flex:1; padding:5px; border:1px solid #ff9eb8;">
                    <button class="action-btn" style="margin:0; width:auto; padding:5px 10px;" onclick="addFlower()">新增</button>
                </div>
                <div id="admin-flower-list"></div>
            </div>

            <!-- 作品展示管理 -->
            <div class="card">
                <h3>✨ 作品展示區圖片管理</h3>
                <div style="margin-bottom: 10px; display: flex; gap: 5px;">
                    <input type="text" id="new-p-title" placeholder="作品名稱" style="flex:1; padding:5px; border:1px solid #ff9eb8;">
                    <input type="text" id="new-p-img" placeholder="圖片網址" style="flex:1; padding:5px; border:1px solid #ff9eb8;">
                    <button class="action-btn" style="margin:0; width:auto; padding:5px 10px;" onclick="addPortfolio()">新增</button>
                </div>
                <div id="admin-portfolio-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // 資料初始化 (儲存於瀏覽器 localStorage)
    let flowers = JSON.parse(localStorage.getItem('flowers_data')) || [
        { id: 1, name: '1號', img: 'https://picsum.photos/200?random=1', stock: 5 },
        { id: 2, name: '2號', img: 'https://picsum.photos/200?random=2', stock: 5 },
        { id: 3, name: '3號', img: 'https://picsum.photos/200?random=3', stock: 0 },
        { id: 4, name: '4號', img: 'https://picsum.photos/200?random=4', stock: 3 },
        { id: 5, name: '5號', img: 'https://picsum.photos/200?random=5', stock: 2 }
    ];

    let portfolio = JSON.parse(localStorage.getItem('portfolio_data')) || [
        { id: 1, title: '範例作品 1', img: 'https://picsum.photos/200?random=101' },
        { id: 2, title: '範例作品 2', img: 'https://picsum.photos/200?random=102' },
        { id: 3, title: '範例作品 3', img: 'https://picsum.photos/200?random=103' }
    ];

    const bows = [
        { id: 1, name: '1號', img: 'https://picsum.photos/200?random=b1' },
        { id: 2, name: '2號', img: 'https://picsum.photos/200?random=b2' },
        { id: 3, name: '3號', img: 'https://picsum.photos/200?random=b3' },
        { id: 4, name: '4號', img: 'https://picsum.photos/200?random=b4' }
    ];

    const bottles = [
        { id: 1, name: '1號', img: 'https://picsum.photos/200?random=v1' },
        { id: 2, name: '2號', img: 'https://picsum.photos/200?random=v2' },
        { id: 3, name: '3號', img: 'https://picsum.photos/200?random=v3' },
        { id: 4, name: '4號', img: 'https://picsum.photos/200?random=v4' }
    ];

    let selectedFlowers = [];
    let selectedBow = null;
    let selectedBottle = null;

    function switchTab(index) {
        const contents = document.querySelectorAll('.tab-content');
        const buttons = document.querySelectorAll('.tab-btn');
        contents.forEach((c, i) => c.classList.toggle('active', i === index));
        buttons.forEach((b, i) => b.classList.toggle('active', i === index));
    }

    function checkPassword() {
        const pwd = document.getElementById('admin-pwd').value;
        if (pwd === '861001') {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            renderAdminLists();
        } else {
            alert('密碼錯誤唷！');
        }
    }

    // 渲染前端選單與作品
    function renderShop() {
        // 花朵
        const fContainer = document.getElementById('flower-grid');
        fContainer.innerHTML = '';
        flowers.forEach(f => {
            let div = document.createElement('div');
            let isOut = f.stock <= 0;
            div.className = `item ${isOut ? 'out-of-stock' : ''} ${selectedFlowers.includes(f.name) ? 'selected' : ''}`;
            div.innerHTML = `<img src="${f.img}"><p>${f.name}</p>`;
            div.onclick = () => {
                if (isOut) {
                    alert('這款花目前庫存為 0，暫時無法選擇唷！');
                    return;
                }
                if (selectedFlowers.includes(f.name)) {
                    selectedFlowers = selectedFlowers.filter(item => item !== f.name);
                    div.classList.remove('selected');
                } else {
                    if (selectedFlowers.length >= 5) {
                        alert('最多只能選擇 5 支花喔！');
                        return;
                    }
                    selectedFlowers.push(f.name);
                    div.classList.add('selected');
                }
                updateText();
            };
            fContainer.appendChild(div);
        });

        // 蝴蝶結
        const bContainer = document.getElementById('bow-grid');
        bContainer.innerHTML = '';
        bows.forEach(b => {
            let div = document.createElement('div');
            div.className = `item ${selectedBow === b.name ? 'selected' : ''}`;
            div.innerHTML = `<img src="${b.img}"><p>${b.name}</p>`;
            div.onclick = () => {
                selectedBow = (selectedBow === b.name) ? null : b.name;
                renderShop();
                updateText();
            };
            bContainer.appendChild(div);
        });

        // 玻璃瓶
        const vContainer = document.getElementById('bottle-grid');
        vContainer.innerHTML = '';
        bottles.forEach(v => {
            let div = document.createElement('div');
            div.className = `item ${selectedBottle === v.name ? 'selected' : ''}`;
            div.innerHTML = `<img src="${v.img}"><p>${v.name}</p>`;
            div.onclick = () => {
                selectedBottle = (selectedBottle === v.name) ? null : v.name;
                renderShop();
                updateText();
            };
            vContainer.appendChild(div);
        });

        // 作品展示
        const pContainer = document.getElementById('portfolio-grid');
        pContainer.innerHTML = '';
        portfolio.forEach(p => {
            let div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<img src="${p.img}"><p>${p.title}</p>`;
            pContainer.appendChild(div);
        });

        updateText();
    }

    // 渲染後台管理清單
    function renderAdminLists() {
        // 花朵清單
        const fList = document.getElementById('admin-flower-list');
        fList.innerHTML = '';
        flowers.forEach((f, index) => {
            let row = document.createElement('div');
            row.className = 'admin-row';
            row.innerHTML = `
                <img src="${f.img}">
                <input type="text" value="${f.name}" id="f-name-${index}" onchange="updateFlower(${index})">
                <input type="number" value="${f.stock}" id="f-stock-${index}" title="庫存" onchange="updateFlower(${index})" min="0">
                <button class="del-btn" onclick="deleteFlower(${index})">刪除</button>
            `;
            fList.appendChild(row);
        });

        // 作品展示清單
        const pList = document.getElementById('admin-portfolio-list');
        pList.innerHTML = '';
        portfolio.forEach((p, index) => {
            let row = document.createElement('div');
            row.className = 'admin-row';
            row.innerHTML = `
                <img src="${p.img}">
                <input type="text" value="${p.title}" id="p-title-${index}" onchange="updatePortfolio(${index})">
                <button class="del-btn" onclick="deletePortfolio(${index})">刪除</button>
            `;
            pList.appendChild(row);
        });
    }

    function updateFlower(index) {
        flowers[index].name = document.getElementById(`f-name-${index}`).value;
        flowers[index].stock = parseInt(document.getElementById(`f-stock-${index}`).value) || 0;
        localStorage.setItem('flowers_data', JSON.stringify(flowers));
        renderShop();
    }

    function deleteFlower(index) {
        if (confirm('確定要刪除這款花嗎？')) {
            flowers.splice(index, 1);
            localStorage.setItem('flowers_data', JSON.stringify(flowers));
            renderAdminLists();
            renderShop();
        }
    }

    function addFlower() {
        let name = document.getElementById('new-name').value;
        let img = document.getElementById('new-img').value || 'https://picsum.photos/200';
        if (!name) {
            alert('請輸入花朵名稱或編號！');
            return;
        }
        flowers.push({ id: Date.now(), name: name, img: img, stock: 5 });
        localStorage.setItem('flowers_data', JSON.stringify(flowers));
        document.getElementById('new-name').value = '';
        document.getElementById('new-img').value = '';
        renderAdminLists();
        renderShop();
    }

    function updatePortfolio(index) {
        portfolio[index].title = document.getElementById(`p-title-${index}`).value;
        localStorage.setItem('portfolio_data', JSON.stringify(portfolio));
        renderShop();
    }

    function deletePortfolio(index) {
        if (confirm('確定要刪除這個作品嗎？')) {
            portfolio.splice(index, 1);
            localStorage.setItem('portfolio_data', JSON.stringify(portfolio));
            renderAdminLists();
            renderShop();
        }
    }

    function addPortfolio() {
        let title = document.getElementById('new-p-title').value;
        let img = document.getElementById('new-p-img').value || 'https://picsum.photos/200';
        if (!title) {
            alert('請輸入作品名稱！');
            return;
        }
        portfolio.push({ id: Date.now(), title: title, img: img });
        localStorage.setItem('portfolio_data', JSON.stringify(portfolio));
        document.getElementById('new-p-title').value = '';
        document.getElementById('new-p-img').value = '';
        renderAdminLists();
        renderShop();
    }

    function updateText() {
        let flowerStr = selectedFlowers.length > 0 ? selectedFlowers.join(',') : '...';
        let bowStr = selectedBow ? `${selectedBow}` : '...';
        let bottleStr = selectedBottle ? `${selectedBottle}` : '...';

        document.getElementById('output').value = `我想要這些花${flowerStr}\n蝴蝶結要${bowStr}\n玻璃瓶要${bottleStr}\n謝謝你!`;
    }

    function copyText() {
        const textarea = document.getElementById('output');
        textarea.select();
        document.execCommand('copy');
        alert('已成功複製訂購文字！快傳給闆娘吧 💕');
    }

    // 初始化
    renderShop();
</script>

</body>
</html>
